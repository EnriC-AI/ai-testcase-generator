[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-testcase-generator"
dynamic = ["version"]
description = "Professional CLI for generating pytest, Markdown and JSON test-case artifacts from YAML or Excel specs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AI Test Case Generator Maintainers"}]
keywords = ["pytest", "qa", "test-automation", "ai", "test-cases"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "Jinja2>=3.1,<4",
  "openai>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
ai-tc-gen = "ai_tc_gen.cli:main"

[project.urls]
Homepage = "https://github.com/<your-user>/ai-testcase-generator"
Documentation = "https://github.com/<your-user>/ai-testcase-generator#readme"
Issues = "https://github.com/<your-user>/ai-testcase-generator/issues"

[tool.setuptools.dynamic]
version = {attr = "ai_tc_gen.__version__"}

[tool.setuptools.packages.find]
include = ["ai_tc_gen*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
